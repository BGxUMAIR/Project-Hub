<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExamVault</title>
<style>
:root{--ink:#163829;--dk:#2B5748;--mid:#618764;--ac:#9CB080;--ac2:#C1CFA1;--card:#B1D3B9;--side:#88BDA4;--soft:#E6F2DD}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);height:100vh;display:flex;overflow:hidden;
background:radial-gradient(circle at 15% 15%,#B1D3B9 0,transparent 45%),radial-gradient(circle at 30% 90%,#2B5748 0,transparent 50%),radial-gradient(circle at 95% 95%,#C1CFA1 0,transparent 40%),linear-gradient(135deg,#88BDA4,#7aae98 60%,#9CB080)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:600}
aside{width:245px;background:rgba(136,189,164,.85);backdrop-filter:blur(8px);padding:16px 15px;display:flex;flex-direction:column;gap:14px;flex:none;box-shadow:2px 0 12px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:8px;font-family:Georgia,serif;font-size:26px;font-weight:600;padding:2px 2px 6px}
.brand svg{width:38px;height:38px}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border:2px solid transparent;border-radius:10px;padding:8px 12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);transition:border-color .3s,box-shadow .3s,background .3s}
.search:focus-within{background:#fff;border-color:var(--dk);box-shadow:0 0 0 3px rgba(43,87,72,.25)}
.search input{border:0;background:none;outline:0;width:100%;font:inherit;color:var(--ink)}
.search input::placeholder{color:#3d5f50}
nav a{display:flex;align-items:center;gap:14px;padding:11px 10px;cursor:pointer;font-size:15.5px;letter-spacing:.2px;border-left:4px solid transparent;border-radius:8px}
nav a:hover{background:rgba(255,255,255,.35)}
nav a.on,nav a.on:hover{background:var(--dk);color:#fff;border-left-color:var(--soft);font-weight:700}
main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 32px;min-height:76px}
.hacts{display:flex;align-items:center;gap:14px;margin-left:auto}
.btn{background:var(--dk);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15);transition:.2s}
.btn:hover{background:#3a6b58}
.btn.ghost{background:rgba(255,255,255,.4);color:var(--dk);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.65)}
.ib{background:none;border:0;color:var(--dk);cursor:pointer;padding:6px;border-radius:8px;display:flex}
.ib:hover{background:rgba(255,255,255,.3)}
.avatar{width:36px;height:36px;border-radius:50%;background:#9aa39c;color:#fff;border:0;cursor:pointer;display:grid;place-items:center;font-size:18px}
#content{flex:1;overflow:auto;padding:0 32px 32px;position:relative;z-index:1}
#content.drag{outline:3px dashed var(--soft);outline-offset:-10px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--ink);background:rgba(230,242,221,.7);padding:6px 14px;border-radius:999px;min-height:36px}
.crumbs:empty{display:none}
.crumbs a{cursor:pointer;color:var(--ink);padding:2px 6px;border-radius:6px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:transparent;transition:.3s}.crumbs a:hover{background:rgba(43,87,72,.12);text-decoration-color:currentColor}
.crumbs span.cur{font-weight:700;color:var(--ink)}
.title{color:var(--ink);font-size:26px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{position:relative;background:rgba(230,242,221,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.12),inset 0 1px 3px rgba(255,255,255,.6);cursor:pointer;transition:all .25s ease;user-select:none}
.card:hover{transform:translateY(-4px);background:rgba(230,242,221,.97);box-shadow:0 10px 24px rgba(0,0,0,.18),inset 0 1px 3px rgba(255,255,255,.6)}
.card .ic{color:var(--dk);margin-bottom:10px}.card .ic svg{width:38px;height:38px}
.card h3{font-size:18px;word-break:break-all}
.card small{display:block;color:#35564a;margin-top:3px;font-size:12.5px}
.dots{position:absolute;top:8px;right:6px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;padding:0}
.dots:hover,.dots:focus-visible{background:rgba(43,87,72,.16)}
.menu{position:absolute;right:8px;top:40px;background:var(--soft);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow:hidden;z-index:20;min-width:120px}
.menu div{padding:9px 14px;cursor:pointer;font-size:14px}.menu div:hover{background:var(--ac2)}.menu div.del{color:#9b2c2c}
.welcome{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wcard{pointer-events:auto;background:var(--ac);padding:20px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 2px 6px rgba(255,255,255,.3);width:min(525px,90%)}
.wcard>div{background:var(--card);border-radius:20px;padding:26px 24px 30px;text-align:center}
.wcard h1{font-size:34px;font-weight:500;color:#111;margin-bottom:16px}
.wcard p{font-size:19px;line-height:1.35;margin-bottom:24px;color:#111}
.wcard .btn{font-family:Georgia,serif;font-size:27px;letter-spacing:2px;padding:12px 40px;border-radius:14px;border:3px solid var(--ac2)}
.wcard .btn svg{width:34px;height:34px}
.compass{position:fixed;right:24px;bottom:24px;width:240px;opacity:.1;pointer-events:none;z-index:0}
.star{position:fixed;right:290px;bottom:40px;width:44px;pointer-events:none;z-index:0;filter:drop-shadow(0 0 6px #fff)}
.empty{color:var(--ink);text-align:center;margin:40px auto 0;max-width:340px;padding:18px 22px;border-radius:16px;background:rgba(230,242,221,.8)}
.drop{border:2px dashed var(--dk);border-radius:16px;color:var(--ink);background:rgba(230,242,221,.55);text-align:center;padding:16px;margin-bottom:20px;cursor:pointer;transition:background .3s}
.drop:hover{background:rgba(230,242,221,.9)}
#overlay{position:fixed;inset:0;background:rgba(20,45,36,.5);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
#overlay.on{display:grid}
.modal{background:var(--soft);border:6px solid var(--ac);border-radius:22px;padding:24px;width:min(420px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.4);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:14px;font-size:24px}
.modal input,.modal textarea{width:100%;padding:10px 12px;border:1px solid var(--ac);border-radius:10px;font:inherit;background:#fff;color:var(--dk);outline:0;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.modal input:focus{border-color:var(--dk)}
.modal label{font-size:13px;font-weight:600;display:block;margin:10px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:6px}
.err{color:#9b2c2c;min-height:16px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.pf{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--ac2);font-size:14.5px}
.pf b{font-weight:600}.pf span{text-align:right}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sec{margin:16px 6px 4px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#24493a}
.sec:first-child{margin-top:2px}
.badge{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.b-class{background:#D6E6F7;color:#1B3F6B}
.b-unit{background:#FBE3CC;color:#7A3A07}
.b-rev{background:#CFEAD0;color:#1F4D2A}
/* ---- motion: slow fade + blur ---- */
@keyframes fb{from{opacity:0;filter:blur(12px);transform:translateY(14px)}}
@keyframes fo{from{opacity:0}}
@keyframes newIn{from{opacity:0;filter:blur(16px);transform:translateY(20px) scale(.92)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
@keyframes twinkle{50%{opacity:.55;transform:scale(.88)}}
aside,header{animation:fo 1s ease backwards}
.anim .card{animation:fb .8s cubic-bezier(.22,.61,.36,1) backwards;animation-delay:calc(min(var(--i),10)*80ms)}
.anim .title,.anim .crumbs,.anim .drop,.anim .empty{animation:fb .8s ease backwards}
.card.new{animation:newIn 1s cubic-bezier(.22,1,.36,1) backwards,glow 1.6s ease-out .4s}
.wcard{animation:fb .9s cubic-bezier(.22,.61,.36,1) backwards}
.compass{animation:fb 1s ease .3s backwards}
.star{animation:fb 1s ease .5s backwards,twinkle 5s ease-in-out 1.5s infinite}
#overlay.on{animation:fo .5s ease}
#overlay.on .modal{animation:fb .7s cubic-bezier(.22,.61,.36,1) backwards}
.menu{animation:fb .5s ease backwards}
.toast{animation:fb .6s ease backwards}
nav a,.btn,.ib{transition:.5s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:700px){aside{width:76px;padding:12px 8px}.brand span,nav a span,.search input,.sec{display:none}.compass,.star{display:none}#content{padding:0 14px 20px}}
</style>
</head>
<body>
<aside>
  <div class="brand"><svg class="i" viewBox="0 0 48 48"><path d="M6 38h20c3 0 4 2 4 4V18c0-2-1-4-4-4H6z"/><path d="M30 18c0-2 1-4 4-4h8v24H34c-3 0-4 2-4 4"/><path d="M14 30C22 24 30 14 42 4c-2 10-8 18-16 22z"/></svg><span>ExamVault</span></div>
  <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Search" autocomplete="off"></div>
  <nav id="nav"></nav>
</aside>
<main>
  <header id="hdr"></header>
  <div id="content"></div>
  <svg class="compass" viewBox="0 0 200 200" fill="none" stroke="#2B5748" stroke-width="1.5"><circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="84" stroke-dasharray="3 4"/><circle cx="100" cy="100" r="68"/><path d="M100 8l14 78 78 14-78 14-14 78-14-78L8 100l78-14z" fill="rgba(43,87,72,.25)"/><path d="M100 30l8 62 62 8-62 8-8 62-8-62-62-8 62-8z"/><circle cx="100" cy="100" r="8"/></svg>
  <svg class="star" viewBox="0 0 24 24" fill="#fff"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
</main>
<div id="overlay"><div class="modal" id="modal"></div></div>
<input type="file" id="file" multiple accept=".pdf,image/*" hidden>

<script>
const KEY='examvault.v1', $=s=>document.querySelector(s);
const ICON={
 doc:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
 list:'<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
 test:'<path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
 tool:'<path d="M14 6l4-3 3 3-3 4M3 21l9-9M10 10L4 4"/><path d="M15 9l-6 6"/><path d="M21 21l-8-8"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 dots:'<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
 img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>'};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${ICON[n]}</svg>`;
const NAV=[['all','ALL DOCUMENTS','doc'],['recent','RECENT','hist'],['subjects','SUBJECTS','list'],['class','CLASS TESTS','test'],['unit','UNIT TESTS','test'],['rev','REVISION WORK','tool']];
const RX={class:/class/i,unit:/unit/i,rev:/revis/i};

const fresh=()=>({folders:[],files:[],profile:{name:'Student Name',address:'123 Academic Lane, Knowledge City',grade:'Class 10',board:'CBSE',goals:'Become a Topper'}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
let cur=null,view='all',q='',anim=true,newId=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const size=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Browser storage is full — delete some files.');return false}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
const kids=id=>S.folders.filter(f=>f.parent===id), filesIn=id=>S.files.filter(f=>f.folder===id);
const path=id=>{const p=[];while(id){const f=S.folders.find(x=>x.id===id);if(!f)break;p.unshift(f);id=f.parent}return p};
const descend=id=>kids(id).flatMap(k=>[k.id,...descend(k.id)]);
const BADGE={class:'Class Test',unit:'Unit Test',rev:'Revision Work'};
const kindOf=id=>{for(const p of path(id).reverse())for(const k in RX)if(RX[k].test(p.name))return k;return''};
const badge=id=>{const k=kindOf(id);return k?`<span class="badge b-${k}">${BADGE[k]}</span>`:''};

/* ---------- modal ---------- */
function modal(html){$('#modal').innerHTML=html;$('#overlay').classList.add('on')}
function closeModal(){$('#overlay').classList.remove('on')}
$('#overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function askName(title,initial,parent,selfId,cb){
  modal(`<h2>${title}</h2><label for="nm">Folder name</label><input id="nm" maxlength="10" value="${esc(initial)}" autocomplete="off">
  <div class="row"><span class="err" id="er"></span><span id="ct"></span></div>
  <div class="acts"><button class="btn ghost" id="no">Cancel</button><button class="btn" id="ok">Save</button></div>`);
  const i=$('#nm'),ct=$('#ct'),er=$('#er');
  const upd=()=>ct.textContent=i.value.length+' / 10';upd();i.focus();i.select();
  i.oninput=()=>{if(i.value.length>10)i.value=i.value.slice(0,10);er.textContent='';upd()};
  const go=()=>{const v=i.value.trim();
    if(!v)return er.textContent='Please enter a name.';
    if(v.length>10)return er.textContent='Max 10 characters.';
    if(S.folders.some(f=>f.parent===parent&&f.id!==selfId&&f.name.toLowerCase()===v.toLowerCase()))return er.textContent='Name already exists here.';
    closeModal();cb(v)};
  $('#ok').onclick=go;$('#no').onclick=closeModal;i.onkeydown=e=>{if(e.key==='Enter')go()};
}
const newFolder=()=>askName(cur?'Create Sub-folder':'Create Folder','',cur,null,n=>{const id=uid();S.folders.push({id,parent:cur,name:n,created:Date.now()});newId=id;save();render()});

/* ---------- profile ---------- */
const PF=[['name','Full Name'],['address','Address'],['grade','Class / Grade'],['board','Target Board'],['goals','Target Goals']];
function profile(){
  const p=S.profile;
  modal(`<h2>Student Profile</h2>${PF.map(([k,l])=>`<div class="pf"><b>${l}</b><span>${esc(p[k]||'—')}</span></div>`).join('')}
  <div class="pf"><b>Total Stored Documents</b><span>${S.files.length}</span></div>
  <div class="acts"><button class="btn ghost" id="cl">Close</button><button class="btn" id="ed">Edit Profile</button></div>`);
  $('#cl').onclick=closeModal;$('#ed').onclick=editProfile;
}
function editProfile(){
  const p=S.profile;
  modal(`<h2>Edit Profile</h2>${PF.map(([k,l])=>`<label>${l}</label><input data-k="${k}" value="${esc(p[k]||'')}">`).join('')}
  <div class="acts"><button class="btn ghost" id="cl">Cancel</button><button class="btn" id="sv">Save</button></div>`);
  $('#cl').onclick=profile;
  $('#sv').onclick=()=>{document.querySelectorAll('#modal input').forEach(i=>p[i.dataset.k]=i.value.trim());save();profile()};
}

/* ---------- files ---------- */
async function addFiles(list){
  if(!cur)return toast('Open a folder first to add files.');
  const ok=[...list].filter(f=>/pdf|^image\//.test(f.type)||/\.pdf$/i.test(f.name));
  if(!ok.length)return toast('Only PDF or image files are supported.');
  const added=[];
  for(const f of ok){
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    const rec={id:uid(),folder:cur,name:f.name,type:f.type||'application/pdf',size:f.size,data,created:Date.now()};
    S.files.push(rec);
    if(!save()){S.files.pop();break}
    added.push(rec);
  }
  if(added.length)toast(added.length+' file(s) saved');
  render();
}
async function openFile(id){
  const f=S.files.find(x=>x.id===id);if(!f)return;
  const b=await (await fetch(f.data)).blob();window.open(URL.createObjectURL(b),'_blank');
}

/* ---------- render ---------- */
function render(){
  const hasRoot=kids(null).length>0;
  $('#nav').innerHTML=NAV.map(([k,l,i],n)=>(n%3?'':`<h4 class="sec">${n?'Categories':'Navigate'}</h4>`)+`<a data-v="${k}" class="${view===k?'on':''}">${ic(i)}<span>${l}</span></a>`).join('');
  const hc=view==='all'&&!q&&S.folders.length?`<a data-go="">Home</a>${path(cur).map((p,i,a)=>' › '+(i===a.length-1?`<span class="cur">${esc(p.name)}</span>`:`<a data-go="${p.id}">${esc(p.name)}</a>`)).join('')}`:'';
  $('#hdr').innerHTML=`<div class="crumbs">${hc}</div><div class="hacts">`+(hasRoot?`${cur?`<button class="btn ghost" id="up">${ic('up')}Upload</button>`:''}<button class="btn" id="mk">${ic('plus')}${cur?'Create Sub-folder':'Create Folder'}</button>`:'')+
    `<button class="ib" title="Menu">${ic('menu')}</button><button class="avatar" id="av" title="Profile">👤</button></div>`;
  const c=$('#content'),A=anim,N=newId;anim=false;newId=null;c.classList.toggle('anim',A);
  if(!S.folders.length&&!q){
    c.innerHTML=`<div class="welcome"><div class="wcard"><div><h1 class="serif">Begin Your Journey!</h1><p>Establish your own mission of becoming a Topper,<br>Start by creating folder, and save your notes!!<br>Securely</p><button class="btn" id="mk0">${ic('folder')}Create a folder!</button></div></div></div>`;
    return;
  }
  let folders=[],files=[],title='';
  if(q){const s=q.toLowerCase();title=`Results for “${esc(q)}”`;folders=S.folders.filter(f=>f.name.toLowerCase().includes(s));files=S.files.filter(f=>f.name.toLowerCase().includes(s))}
  else if(view==='recent'){title='Recent';folders=[...S.folders].sort((a,b)=>b.created-a.created).slice(0,8);files=[...S.files].sort((a,b)=>b.created-a.created).slice(0,12)}
  else if(view==='subjects'){title='Subjects';folders=kids(null)}
  else if(RX[view]){title=NAV.find(n=>n[0]===view)[1].replace(/\b\w/g,x=>x)+'';const ids=S.folders.filter(f=>RX[view].test(f.name)).map(f=>f.id);folders=S.folders.filter(f=>ids.includes(f.id));files=S.files.filter(f=>ids.includes(f.folder))}
  else{folders=kids(cur);files=filesIn(cur);
    title=cur?esc(path(cur).slice(-1)[0].name):'All Documents'}
  const fc=folders.map((f,ix)=>{const n=kids(f.id).length+filesIn(f.id).length;
    return `<div class="card${f.id===N?' new':''}" style="--i:${ix}" data-open="${f.id}"><div class="ic">${ic('folder')}</div><h3 class="serif">${esc(f.name)}</h3><small>${n} item${n===1?'':'s'} · ${fmt(f.created)}</small>${badge(f.id)}
    <button class="ib dots" data-dots="${f.id}" aria-label="Folder options">${ic('dots')}</button></div>`}).join('');
  const fl=files.map((f,ix)=>`<div class="card" style="--i:${folders.length+ix}" data-file="${f.id}"><div class="ic">${ic(f.type.startsWith('image')?'img':'doc')}</div><h3 class="serif" style="font-size:15px">${esc(f.name)}</h3><small>${size(f.size)} · ${fmt(f.created)}</small>${badge(f.folder)}
    <button class="ib dots" data-fdots="${f.id}" aria-label="File options">${ic('dots')}</button></div>`).join('');
  c.innerHTML=`<h2 class="title">${title}</h2>`+
    (cur&&view==='all'&&!q?`<div class="drop" id="dz">Drag & drop PDF / image notes here, or click to upload</div>`:'')+
    (fc||fl?`<div class="grid">${fc}${fl}</div>`:`<div class="empty">${cur&&view==='all'?'This folder is empty.':'Nothing to show here yet.'}</div>`);
}

/* ---------- events ---------- */
function menu(el,items){
  document.querySelectorAll('.menu').forEach(m=>m.remove());
  const m=document.createElement('div');m.className='menu';
  items.forEach(([l,fn,cls])=>{const d=document.createElement('div');d.textContent=l;if(cls)d.className=cls;d.onclick=e=>{e.stopPropagation();m.remove();fn()};m.appendChild(d)});
  el.closest('.card').appendChild(m);
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('.dots'))document.querySelectorAll('.menu').forEach(m=>m.remove());
  let el;
  if(el=t.closest('[data-v]')){view=el.dataset.v;q='';$('#q').value='';anim=true;render();return}
  if(t.closest('#mk')||t.closest('#mk0'))return newFolder();
  if(t.closest('#av'))return profile();
  if(t.closest('#up')||t.closest('#dz'))return $('#file').click();
  if(el=t.closest('[data-go]')){cur=el.dataset.go||null;anim=true;render();return}
  if(el=t.closest('[data-dots]')){e.stopPropagation();const id=el.dataset.dots,f=S.folders.find(x=>x.id===id);
    return menu(el,[['Open',()=>openF(id)],['Rename',()=>askName('Rename Folder',f.name,f.parent,id,n=>{f.name=n;save();render()})],
      ['Delete',()=>{const all=[id,...descend(id)];const nf=S.files.filter(x=>all.includes(x.folder)).length;
        if(confirm(`Delete "${f.name}" with ${all.length-1} sub-folder(s) and ${nf} file(s)?`)){S.folders=S.folders.filter(x=>!all.includes(x.id));S.files=S.files.filter(x=>!all.includes(x.folder));if(cur&&!S.folders.some(x=>x.id===cur))cur=null;save();render()}},'del']])}
  if(el=t.closest('[data-fdots]')){e.stopPropagation();const id=el.dataset.fdots;
    return menu(el,[['Open',()=>openFile(id)],['Delete',()=>{if(confirm('Delete this file?')){S.files=S.files.filter(x=>x.id!==id);save();render()}},'del']])}
  if(el=t.closest('[data-file]'))return openFile(el.dataset.file);
  if(el=t.closest('[data-open]'))return openF(el.dataset.open);
});
document.addEventListener('dblclick',e=>{});  // single click also opens; double-click therefore works too
function openF(id){cur=id;view='all';q='';anim=true;$('#q').value='';render()}
$('#q').oninput=e=>{q=e.target.value.trim();render()};
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
const c=$('#content');
['dragover','dragenter'].forEach(ev=>c.addEventListener(ev,e=>{if(cur&&view==='all'){e.preventDefault();c.classList.add('drag')}}));
['dragleave','drop'].forEach(ev=>c.addEventListener(ev,()=>c.classList.remove('drag')));
c.addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});
render();
</script>
</body>
</html>
